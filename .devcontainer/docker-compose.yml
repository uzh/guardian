services:
  dev:
    container_name: guardian_dev
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    volumes:
      # default user is "opam"
      - ..:/workspace:cached
      - build:/workspace/_build:cached
      - opam-5.5.2-2.6:/home/opam/.opam:cached
      - ${HOME}/.claude:/home/opam/.claude
      # Add database folders to dev container
      - db:/databases/db-mariadb/:ro
      - db-postgres:/databases/db-postgres/:ro
    depends_on: [database, database-postgres]
    ports: [3020:3000]
    command: sleep infinity

  database:
    container_name: guardian_database
    image: mariadb:10.6
    restart: unless-stopped
    command: --max_allowed_packet=629145600
    ports: [3320:3306]
    environment:
      - TZ=Europe/Zurich
      - MYSQL_ALLOW_EMPTY_PASSWORD='yes'
      - MYSQL_ROOT_HOST=%
      - MYSQL_DATABASE=development
      - MYSQL_USER=root
    volumes:
      - db:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d/:ro

  # for guardian-postgresql
  database-postgres:
    container_name: guardian_database_postgres
    image: postgres:18
    restart: unless-stopped
    ports: [3321:5432]
    environment:
      - TZ=Europe/Zurich
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=development
    volumes:
      - db-postgres:/var/lib/postgresql
      - ./init-postgres:/docker-entrypoint-initdb.d/:ro

  adminer:
    image: adminer:standalone
    restart: unless-stopped
    ports: [8080:8080]
    depends_on: [database, database-postgres]

volumes:
  build:
  opam-5.5.2-2.6:
  db:
  db-postgres:
